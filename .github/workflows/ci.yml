name: Native Swift tests and macOS build

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: ./tests/run.sh
      - run: ./scripts/build-cli.sh
      - run: ./scripts/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Session-Share-macOS-arm64
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
