name: Native Swift tests and macOS build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/run.sh
      - run: ./scripts/build-cli.sh
      - run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Session-Share-macOS-arm64
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
